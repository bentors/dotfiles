<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Portfolio aesthetic: Geist for UI text, Geist Mono for monospace. -->
<fontconfig>
  <alias><family>monospace</family><prefer><family>Geist Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Geist</family></prefer></alias>
</fontconfig>
