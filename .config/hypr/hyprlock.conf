general {
    hide_cursor = true
}

background {
    path = ~/.config/hypr/wallpaper.png
    color = rgb(1a1b26)
    blur_passes = 2
    blur_size = 4
}

# Data: dia da semana, dia e mês
label {
    text = cmd[update:60000] LC_TIME=C date +'%A, %B %-d'
    font_family = URW Gothic
    font_size = 22
    color = rgb(a9b1d6)
    position = 0, 280
    halign = center
    valign = center
}

# Hora 24h
label {
    text = cmd[update:1000] date +'%H:%M'
    font_family = URW Gothic Semi-Bold
    font_size = 96
    color = rgb(c0caf5)
    position = 0, 180
    halign = center
    valign = center
}

# Nome do usuário
label {
    text = $DESC
    font_family = URW Gothic
    font_size = 18
    color = rgb(c0caf5)
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    font_family = URW Gothic
    size = 260, 46
    rounding = -1
    outline_thickness = 2
    outer_color = rgb(7aa2f7) rgb(bb9af7) 45deg
    inner_color = rgb(1a1b26)
    font_color = rgb(c0caf5)
    check_color = rgb(e0af68)
    fail_color = rgb(f7768e)
    fail_text = senha incorreta
    placeholder_text = <i>enter pass</i>
    dots_center = true
    fade_on_empty = false
    position = 0, -170
    halign = center
    valign = center
}
