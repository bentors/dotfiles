# Estética do portfólio (bentorangel.vercel.app):
# Geist Mono, fundo #050505, roxo #ac4bff, texto zinc, labels em caixa alta espaçada.

general {
    hide_cursor = true
}

background {
    path = ~/.config/hypr/wallpaper.png
    color = rgb(050505)
    blur_passes = 2
    blur_size = 4
}

# Data: dia da semana, dia e mês (label estilo "text-purple-400 uppercase tracking-widest")
label {
    text = cmd[update:60000] echo "<span letter_spacing='4096'>$(LC_TIME=C date +'%A, %B %-d' | tr a-z A-Z)</span>"
    font_family = Geist Mono SemiBold
    font_size = 16
    color = rgb(c07eff)
    position = 0, 280
    halign = center
    valign = center
}

# Hora 24h
label {
    text = cmd[update:1000] date +'%H:%M'
    font_family = Geist Mono Black
    font_size = 96
    color = rgb(f4f4f5)
    position = 0, 180
    halign = center
    valign = center
}

# Nome do usuário
label {
    text = <span letter_spacing='2048'>$DESC</span>
    font_family = Geist Mono Medium
    font_size = 14
    color = rgb(a1a1aa)
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    font_family = Geist Mono
    size = 260, 46
    rounding = -1
    outline_thickness = 2
    outer_color = rgb(d9b3ff) rgb(ac4bff) rgb(8200da) 45deg
    inner_color = rgb(0a0a0a)
    font_color = rgb(f4f4f5)
    check_color = rgb(00d294)
    fail_color = rgb(f87171)
    fail_text = senha incorreta
    placeholder_text = <span foreground='##71717a'>enter pass</span>
    dots_center = true
    fade_on_empty = false
    position = 0, -170
    halign = center
    valign = center
}
